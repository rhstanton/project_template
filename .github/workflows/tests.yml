name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.12']

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive  # Initialize repro-tools submodule

    - name: Check GNU Make version
      run: make --version

    - name: Install GNU Make 4.3+ on macOS
      if: runner.os == 'macOS'
      run: |
        brew install make
        echo "$(brew --prefix)/opt/make/libexec/gnubin" >> $GITHUB_PATH

    - name: Verify Make version
      run: make --version | head -1

    - name: Install uv
      uses: astral-sh/setup-uv@v8.1.0
      with:
        enable-cache: true

    - name: Set up environment
      run: |
        make environment
      
    - name: Verify environment
      run: |
        make verify

    - name: Run code quality checks
      run: |
        make lint
        make format-check
        make type-check

    # Inputs before anything is built from them. data/CHECKSUMS.txt pins the
    # data; a silent change to it invalidates every result downstream, and until
    # 2026-08-17 nothing in CI looked.
    - name: Check data checksums
      run: |
        make data-checksums-check

    - name: Build all artifacts
      run: |
        make all

    # Publishing runs BEFORE `make test`, and the order is the point.
    #
    # `make publish` is described throughout the docs as the only sanctioned
    # route from output/ into paper/, and it carries the git safety gates --
    # clean tree, not behind upstream, artifacts built from the current HEAD.
    # Nothing in CI exercised it. Worse, tests/test_publishing.py skips every
    # one of its cases with "Nothing has been published yet", so on a runner
    # eleven tests silently did not run: the component with the strongest
    # claims had the least coverage.
    #
    # Publishing here satisfies that precondition, so those tests execute
    # against artifacts this job actually built. A runner is publish's happy
    # path: the checkout is clean and at the commit under test, and `behind` is
    # None on a detached HEAD, which the gate treats as "not behind".
    #
    # Note this ran green for months while doing nothing at all -- `$(PYTHON) -m
    # repro_tools.cli publish` had no module entry point, so it ignored its
    # arguments and exited 0, and make then touched the stamp recording the work
    # as done.
    # Publishing requires a clean tree, and building here legitimately dirties
    # exactly one tracked file.
    #
    # juliapkg installs the newest Julia that satisfies env/juliapkg.json, and on
    # these runners OpenSSL_jll caps that at 1.11.9 while env/Manifest.toml was
    # resolved with 1.12.4. Pkg REWRITES a manifest it cannot honor rather than
    # failing, so `make environment` leaves env/Manifest.toml modified. That is a
    # recorded limitation of pinning a manifest a template cannot control the
    # Julia for -- see the comment at env/Makefile around the manifest check.
    #
    # The file is restored rather than the gate relaxed. Publishing with
    # ALLOW_DIRTY=1 would make this step pass while testing nothing, which is the
    # failure mode this whole step exists to correct. And the restore is not
    # blanket: if anything ELSE is dirty, that is unexplained and the job stops,
    # because "the build modified a tracked file" is exactly what the publish
    # gate is for.
    - name: Restore the Julia manifest rewritten by the build
      run: |
        echo "Working tree after build:"
        git status --porcelain
        unexpected="$(git status --porcelain | grep -v ' env/Manifest.toml$' || true)"
        if [ -n "$unexpected" ]; then
          echo ""
          echo "ERROR: the build dirtied files other than env/Manifest.toml:" >&2
          echo "$unexpected" >&2
          echo "" >&2
          echo "A build must not modify tracked files. Investigate rather than" >&2
          echo "widening this exception." >&2
          exit 1
        fi
        git checkout -- env/Manifest.toml || true
        git status --porcelain

    - name: Publish artifacts to paper/
      run: |
        make publish

    - name: Run tests
      run: |
        make test

    - name: Test outputs exist
      run: |
        make test-outputs

    # `test-outputs` only checks that files exist and are non-empty, so it
    # passes on outputs whose every number is wrong. This step reads them.
    #
    # It can run in CI only because the reference is committed. `make
    # diff-outputs` compares against paper/, which is gitignored on purpose --
    # it is meant to be a separate, Overleaf-synced repository -- so on a runner
    # there is nothing to compare against and it quietly does no work.
    # env/baseline/published.json lives inside this repository for that reason.
    #
    # Depends on SOURCE_DATE_EPOCH being fixed in env/env.sh: without it the
    # rebuilt artifacts differ run to run and this step would be noise.
    - name: Check published numbers
      run: |
        make check-baseline

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-${{ matrix.os }}
        path: output/
        if-no-files-found: warn

  # THE ARTIFACT SOMEONE OUTSIDE ACTUALLY RECEIVES.
  #
  # Every job above checks this repository. A journal editor gets
  # `make journal-package` instead, and nothing built it automatically until
  # 2026-08-20 — which is how the rule came to vendor lib/repro-tools with
  # `cp -r`, sweeping in a 79 MB .venv whose bin/python entries are absolute
  # symlinks into the author's home directory. Broken on arrival for every
  # reviewer, and invisible here.
  #
  # The rule asserts its own output now. This job makes that assertion run, and
  # re-checks the result independently afterwards.
  package:
    name: replication package
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install uv
      uses: astral-sh/setup-uv@v8.1.0
      with:
        enable-cache: true

    - name: Give git an identity for the package's own commit
      # `make journal-package` runs `git init` and commits inside the package, so
      # the archive carries a clean one-commit history for review. A runner has
      # no identity configured, so that commit fails with "empty ident name" --
      # a failure of the runner's setup, not of the packaging. A real package is
      # built by an author with their own identity; this one is only verified.
      run: |
        git config --global user.name "CI package build"
        git config --global user.email "ci@invalid.example"

    - name: Build the replication package
      run: make journal-package

    - name: The package must be self-contained
      run: |
        set -euo pipefail
        pkg=replication-package
        test -d "$pkg" || { echo "::error::$pkg was not created"; exit 1; }

        empty="$(find "$pkg/lib" -mindepth 1 -maxdepth 1 -type d -empty 2>/dev/null || true)"
        if [ -n "$empty" ]; then
          echo "::error::unvendored submodules (empty directories):"; echo "$empty"; exit 1
        fi

        if [ -e "$pkg/.gitmodules" ]; then
          echo "::error::.gitmodules survived into the package"; exit 1
        fi

        links="$(find "$pkg" -type l -not -path "$pkg/.git/*" 2>/dev/null || true)"
        if [ -n "$links" ]; then
          echo "::error::symlinks in the package:"; echo "$links"; exit 1
        fi

        if [ -d "$pkg/lib/repro-tools/.venv" ]; then
          echo "::error::a virtualenv was vendored into the package"; exit 1
        fi

        n="$(find "$pkg/lib/repro-tools" -type f | wc -l)"
        test "$n" -gt 0 || { echo "::error::lib/repro-tools vendored 0 files"; exit 1; }
        echo "  lib/repro-tools: $n files"

    # Does it work for someone with no git at all? Copied without .git, so no
    # git command can succeed, then asked what it would build.
    - name: The package must build without git
      run: |
        set -euo pipefail
        rm -rf /tmp/as-editor && mkdir -p /tmp/as-editor
        tar -c --exclude=.git -C replication-package . | tar -x -C /tmp/as-editor
        cd /tmp/as-editor
        test ! -e .git || { echo "::error::.git reached the copy"; exit 1; }
        plan="$(make -n all 2>&1)"
        echo "$plan" | head -20
        if echo "$plan" | grep -qi "submodule"; then
          echo "::error::the build plan still mentions submodules:"
          echo "$plan" | grep -i submodule
          exit 1
        fi

    - name: Upload the package for inspection
      uses: actions/upload-artifact@v7
      with:
        name: replication-package
        path: replication-package/
        if-no-files-found: error
